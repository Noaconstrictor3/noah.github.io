<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NoahCalc</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NoahCalc">

</head>

<body>

<div class="dynamic-island" id="island">
Ready
</div>

<div class="calculator">

<div class="display" id="display">0</div>

<div class="buttons">

<button class="gray" onclick="clearDisplay()">AC</button>
<button class="gray" onclick="append('%')">%</button>
<button class="gray" onclick="append('/')">÷</button>
<button class="orange" onclick="append('*')">×</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button class="orange" onclick="append('-')">−</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button class="orange" onclick="append('+')">+</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button class="orange" onclick="calculate()">=</button>

<button class="zero" onclick="append('0')">0</button>
<button onclick="append('.')">.</button>

</div>

</div>

<button class="mic" onclick="voiceInput()">🎤</button>

<button class="ai" onclick="aiHelper()">AI</button>

<script src="script.js"></script>

</body>
</html>
